name: Build Kivy APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install setuptools（补distutils兼容）
        run: pip install setuptools

      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v2
        with:
          buildozer_spec: buildozer.spec
          command: android debug

      - name: Upload generated APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: bin/*.apk
